name: Scrape and Generate HTML

on:
  schedule:
    # Runs every 6 hours
    - cron: '*/10 * * * *'
  workflow_dispatch:   # Allows manual trigger

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'  # or your preferred version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 jinja2

      - name: Run script
        run: python3 code/scrape_xp.py --url "https://leekduck.com/events/xp-celebration-event-2025/" --out-dir ./

      # OPTIONAL: Commit and push the generated HTML file
      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add xp_celebration.html  # Change to your actual generated file name
          git commit -m "[auto] Update generated XP HTML" || echo "No changes to commit"
          git push
        env:
          # Needed for pushing to the repository
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
